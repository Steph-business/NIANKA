<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" fill="#ffffff"/>
  
  <!-- Shadow -->
  <ellipse cx="150" cy="250" rx="90" ry="16" fill="rgba(0,0,0,0.08)"/>

  <g transform="translate(50, 35)">
    <!-- Whole Papaya -->
    <path d="M 90,20 C 140,20 180,70 170,140 C 160,200 110,230 70,220 C 25,205 10,140 20,90 C 30,40 60,20 90,20 Z" fill="#FB8C00" stroke="#EF6C00" stroke-width="3"/>
    
    <!-- Papaya Highlight Gradient Layer -->
    <path d="M 85,25 C 120,25 155,65 145,130 C 135,185 95,210 65,200 C 40,190 28,150 32,100 Z" fill="#FFB74D" opacity="0.6"/>

    <!-- Stem -->
    <path d="M 88,20 L 92,5 L 98,6 L 94,20 Z" fill="#43A047"/>

    <!-- Papaya Half Slice with seeds -->
    <g transform="translate(60, 45) scale(0.75)">
      <path d="M 90,20 C 140,20 180,70 170,140 C 160,200 110,230 70,220 C 25,205 10,140 20,90 C 30,40 60,20 90,20 Z" fill="#E65100" stroke="#BF360C" stroke-width="3"/>
      <path d="M 85,35 C 125,35 155,75 145,135 C 135,185 95,205 70,195 C 35,185 25,135 30,95 Z" fill="#FF7043"/>
      <!-- Inner Cavity -->
      <path d="M 85,60 C 110,60 125,90 120,130 C 115,160 90,175 75,170 C 50,165 45,130 50,100 C 55,75 70,60 85,60 Z" fill="#3E2723"/>
      
      <!-- Seeds -->
      <circle cx="75" cy="90" r="4" fill="#1B5E20"/>
      <circle cx="85" cy="95" r="4" fill="#212121"/>
      <circle cx="95" cy="100" r="4" fill="#1B5E20"/>
      <circle cx="70" cy="110" r="4" fill="#212121"/>
      <circle cx="82" cy="115" r="4" fill="#1B5E20"/>
      <circle cx="92" cy="120" r="4" fill="#212121"/>
      <circle cx="78" cy="130" r="4" fill="#1B5E20"/>
      <circle cx="88" cy="135" r="4" fill="#212121"/>
      <circle cx="80" cy="145" r="4" fill="#1B5E20"/>
    </g>
  </g>
</svg>
